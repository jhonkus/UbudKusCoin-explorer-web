name: Release Explorer

'on':
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  quality:
    name: 'Lint, Typecheck, Test & Build (Node 22.x)'
    runs-on: ubuntu-latest
    if: "github.event.pull_request.merged == true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript compiler check
        run: npm run typecheck

      - name: Run Jest test suite with coverage
        run: npm run test:coverage -- --forceExit

      - name: Build Next.js application
        run: npm run build

  release:
    name: Publish release
    needs: quality
    if: "github.event.action == 'closed' && github.event.pull_request.merged == true"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "VERSION must contain a valid SemVer value, found: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure version tag is new
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASE_VERSION} already exists. Bump VERSION before merging."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_NOTES: |
            ## UbudKusChain Explorer v${{ steps.version.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --target "${TARGET_SHA}" \
            --title "UbudKusChain Explorer v${RELEASE_VERSION}" \
            --generate-notes \
            --notes "${RELEASE_NOTES}"

  pages-build:
    name: Build Pages artifact
    needs: release
    if: "github.event.action == 'closed' && github.event.pull_request.merged == true"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ghpages

  pages-deploy:
    name: Deploy to GitHub Pages
    needs: pages-build
    if: "github.event.action == 'closed' && github.event.pull_request.merged == true"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
